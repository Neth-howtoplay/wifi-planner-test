<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TRUE GIGATEX – Login</title>
  <style>
    :root{
      --bg1: #0b1220;
      --bg2: #0f1629;
      --glass: rgba(255,255,255,0.12);
      --glass-border: rgba(255,255,255,0.25);
      --ink: #dbe6ff;
      --accent: #4ea5ff;
      --accent-2:#61d7ff;
      --btn:#3866a3;
      --btn-hover:#2f568a;
      --ok:#399d4a;
      --err:#e15b64;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--ink);
      background: radial-gradient(1200px 900px at 20% 10%, #1a2542 0%, transparent 60%),
                  radial-gradient(1400px 1000px at 80% 120%, #0b4579 0%, transparent 60%),
                  linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    .frame{
      height:100%;
      display:grid;
      place-items:center;
      padding:4vmin;
    }
    .card{
      position:relative;
      width:min(1050px, 92vw);
      min-height:460px;
      border-radius:28px;
      background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,.08)) ;
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 30px 60px rgba(0,0,0,.35), inset 0 0 0 1px var(--glass-border);
      overflow:hidden;
      display:grid;
      grid-template-columns: 1.1fr 1fr;
    }
    .glow{
      pointer-events:none;
      position:absolute; inset:-10% -20% -10% -20%;
      background: radial-gradient(60% 40% at 20% 10%, rgba(255,255,255,.18), transparent 60%),
                  radial-gradient(60% 45% at 80% 20%, rgba(97,215,255,.18), transparent 60%),
                  radial-gradient(60% 45% at 50% 100%, rgba(78,165,255,.15), transparent 60%);
      filter: blur(28px) saturate(120%);
      animation: float 12s ease-in-out infinite;
    }
    @keyframes float{
      0%{transform:translate3d(0,0,0)}
      50%{transform:translate3d(0,-12px,0)}
      100%{transform:translate3d(0,0,0)}
    }

    .left{display:grid; place-items:center; padding:40px 28px 40px 40px;}
    .left img{max-width:100%; height:auto; filter: drop-shadow(0 6px 24px rgba(0,0,0,.35));}

    .right{padding:42px 48px 48px 32px; display:flex; flex-direction:column; gap:24px;}

    h1{margin:0; font-size:28px; letter-spacing:.2px}

    .field{position:relative;}
    .label{font-size:13px; opacity:.85; margin-bottom:8px; display:block}
    .input{
      width:100%; padding:14px 44px 14px 44px; border-radius:14px;
      color:var(--ink); font-size:15px; letter-spacing:.2px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.28);
      outline:none;
      backdrop-filter: blur(4px);
      transition: box-shadow .2s, border-color .2s, background .2s;
    }
    .input:focus{border-color: var(--accent); box-shadow: 0 0 0 6px rgba(78,165,255,.18); background: rgba(255,255,255,.13);}
    .icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:20px; height:20px; opacity:.9}

    .captcha-row{display:flex; align-items:center; gap:14px}
    canvas#captcha{ border-radius:12px; background:#0b0f19; padding:6px 10px; border:1px solid rgba(255,255,255,.25)}
    .refresh{display:inline-grid; place-items:center; width:36px; height:36px; border-radius:12px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); cursor:pointer; user-select:none; transition:transform .15s ease;}
    .refresh:active{ transform: scale(.96) }

    .actions{display:flex; gap:16px; align-items:center; margin-top:4px}
    .btn{ padding:12px 22px; border-radius:16px; border:1px solid rgba(255,255,255,.25); background: linear-gradient(180deg, var(--btn), #274b7e); color:white; font-weight:600; letter-spacing:.2px; cursor:pointer; box-shadow: 0 10px 24px rgba(46,108,193,.35);}
    .btn:hover{ background: linear-gradient(180deg, var(--btn-hover), #21416d)}

    .msg{min-height:22px; font-size:14px}
    .msg.ok{color:var(--ok)}
    .msg.err{color:var(--err)}

    @media (max-width: 920px){.card{ grid-template-columns: 1fr; } .left{ display:none; }}
  </style>
</head>
<body>
  <div class="frame">
    <div class="card" role="region" aria-label="Login Panel">
      <div class="glow" aria-hidden="true"></div>

      <aside class="left">
        <img src="True_Gigatex1.png" alt="TRUE GIGATEX FIBER" />
      </aside>

      <main class="right">
        <h1>Login</h1>

        <div class="field">
          <label class="label" for="user">Username</label>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="4"/><path d="M4 20c2.2-4 13.8-4 16 0"/></svg>
          <input id="user" class="input" type="text" autocomplete="username" placeholder="Enter username" />
        </div>

        <div class="field">
          <label class="label" for="pass">Password</label>
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="11" width="18" height="9" rx="2"/><path d="M7 11V8a5 5 0 0 1 10 0v3"/></svg>
          <input id="pass" class="input" type="password" autocomplete="current-password" placeholder="Enter password" />
        </div>

        <div class="field">
          <label class="label" for="captcha-input">CAPTCHA</label>
          <div class="captcha-row">
            <canvas id="captcha" width="220" height="48" aria-label="captcha image"></canvas>
            <button class="refresh" id="refresh" title="Refresh CAPTCHA" aria-label="refresh captcha">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 3 9 3 9 9"/></svg>
            </button>
          </div>
          <input id="captcha-input" class="input" style="margin-top:10px" type="text" inputmode="latin" placeholder="Type the characters" />
        </div>

        <div class="actions">
          <button id="login" class="btn">Login</button>
          <div id="msg" class="msg" role="status" aria-live="polite"></div>
        </div>
      </main>
    </div>
  </div>

  <script>
    const VALID_USER = "admin";
    const VALID_PASS = "gigatex965";

    const CAP_LEN = 7;
    const alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let currentCaptcha = "";

    const canvas = document.getElementById('captcha');
    const ctx = canvas.getContext('2d');

    function rnd(min, max){ return Math.random() * (max-min) + min; }

    function drawNoise(){
      const g = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
      g.addColorStop(0, '#0e1322');
      g.addColorStop(1, '#1a2750');
      ctx.fillStyle = g; ctx.fillRect(0,0,canvas.width,canvas.height);
      for(let i=0;i<24;i++){
        ctx.fillStyle = `hsla(${Math.floor(rnd(180,240))},70%,${Math.floor(rnd(60,80))}%,.75)`;
        ctx.beginPath();
        ctx.arc(rnd(0,canvas.width), rnd(0,canvas.height), rnd(0.8, 2.6), 0, Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha = .35; ctx.strokeStyle = '#9ad1ff';
      for(let i=0;i<3;i++){
        ctx.beginPath();
        ctx.moveTo(rnd(0,40), rnd(10,38));
        for(let x=0;x<6;x++) ctx.lineTo(rnd(40,canvas.width), rnd(10,38));
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function createCaptcha(){
      currentCaptcha = Array.from({length: CAP_LEN}, ()=> alphabet[Math.floor(Math.random()*alphabet.length)]).join('');
      drawNoise();
      ctx.font = 'bold 28px ui-sans-serif, system-ui';
      ctx.textBaseline = 'middle';
      const startX = 18;
      for(let i=0;i<currentCaptcha.length;i++){
        const ch = currentCaptcha[i];
        const x = startX + i*28 + rnd(-2,2);
        const y = canvas.height/2 + rnd(-2,2);
        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(rnd(-0.35, 0.35));
        const cg = ctx.createLinearGradient(-10,-10, 18, 24);
        cg.addColorStop(0, '#eaffff');
        cg.addColorStop(1, '#66bfff');
        ctx.fillStyle = cg;
        ctx.fillText(ch, 0,0);
        ctx.restore();
      }
      sessionStorage.setItem('captcha_code', currentCaptcha);
      document.getElementById('captcha-input').value = '';
    }

    function resetCaptchaOnExit(){ sessionStorage.removeItem('captcha_code'); }

    window.addEventListener('beforeunload', resetCaptchaOnExit);
    window.addEventListener('pagehide', resetCaptchaOnExit);
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden') resetCaptchaOnExit(); });

    document.getElementById('refresh').addEventListener('click', createCaptcha);

    const $msg = document.getElementById('msg');
    function setMsg(text, ok=false){ $msg.textContent = text || ''; $msg.className = 'msg ' + (ok ? 'ok' : 'err'); }

    document.getElementById('login').addEventListener('click', (e)=>{
      e.preventDefault();
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;
      const c = document.getElementById('captcha-input').value.trim().toUpperCase();

      if(!u || !p || !c){ setMsg('Please fill all fields.'); createCaptcha(); return; }
      if(u !== VALID_USER){ setMsg('Username is incorrect.'); createCaptcha(); return; }
      if(p !== VALID_PASS){ setMsg('Password is incorrect.'); createCaptcha(); return; }
      if(c !== currentCaptcha){ setMsg('CAPTCHA is incorrect. Try again.'); createCaptcha(); return; }

      setMsg('Success! Logging in…', true);
      resetCaptchaOnExit();
      setTimeout(()=>{ window.location.href = '#/dashboard'; }, 650);
    });

    createCaptcha();
  </script>
</body>
</html>
