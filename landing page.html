<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Locked | True Network</title>
    <style>
        :root {
            --true-red: #ff0000;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 1);
            --bg-color: #fcfcfc;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Prompt', 'Tahoma', sans-serif;
            background-color: var(--bg-color);
            overflow: hidden;
            position: relative;
        }

        /* Background Shapes */
        .shape {
            position: absolute;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.12;
            border-radius: 50%;
        }
        .shape-1 { width: 400px; height: 400px; background: var(--true-red); top: -150px; right: -100px; }
        .shape-2 { width: 300px; height: 300px; background: var(--true-red); bottom: -100px; left: -50px; }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(160%);
            -webkit-backdrop-filter: blur(25px) saturate(160%);
            border: 2px solid var(--glass-border);
            border-radius: 35px;
            padding: 50px 30px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        .logo {
            width: 140px;
            height: auto;
            margin-bottom: 30px;
        }

        h1 { color: var(--true-red); font-size: 28px; margin: 0 0 10px 0; font-weight: 800; }
        h2 { color: #444; font-size: 18px; margin: 0 0 30px 0; font-weight: 500; }

        .message-container {
            color: #555;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Button Styles */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 16px;
            border-radius: 18px;
            font-weight: bold;
            font-size: 17px;
            text-decoration: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* ปุ่มโทร Call Center */
        .btn-call {
            background: var(--true-red);
            color: white;
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.2);
        }
        .btn-call:hover {
            background: #e60000;
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 0, 0, 0.3);
        }

        /* ปุ่มคุยกับมะลิ (AI Mali) */
        .btn-mali {
            background: white;
            color: var(--true-red);
            border: 2px solid var(--true-red);
        }
        .btn-mali:hover {
            background: #fff5f5;
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(255, 0, 0, 0.1);
        }

        .footer { margin-top: 40px; font-size: 11px; color: #aaa; letter-spacing: 0.5px; }
        .status-badge {
            display: inline-block;
            margin-top: 15px;
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 50px;
            font-family: monospace;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="glass-card">
        <img src="True_logo.png" alt="True" class="logo">
        
        <h1>Device Locked</h1>
        <h2>อุปกรณ์ถูกระงับการใช้งาน</h2>

        <div class="message-container">
            <p>อุปกรณ์นี้ถูกจำกัดให้ใช้งานเฉพาะบนเครือข่ายของ <strong>True</strong> เท่านั้น<br>
            <span style="font-size: 13px; opacity: 0.7;">This device is restricted to True Network only.</span></p>
        </div>

        <div class="button-group">
            <a href="#" class="btn btn-mali">คุยกับ "มะลิ" (AI Assistant)</a>
            
            <a href="tel:1242" class="btn btn-call">ติดต่อเจ้าหน้าที่ โทร. 1242</a>
        </div>

        <div class="footer">
            Property of True Corporation Public Company Limited.<br>
            <span class="status-badge">NW_LOCK_001</span>
        </div>
    </div>

</body>
</html>
